<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f3f1" />
    <meta name="robots" content="noindex" />
    <!--
      Page 404 : GitHub Pages la sert pour toute adresse inconnue sous /Portefolio/, quelle que soit
      sa profondeur. Tous les liens partent donc de la base du site (%BASE_URL%), jamais d'un chemin relatif.
      Page statique, sans JavaScript (seul le thème est posé par le script ci-dessous).
      Les textes entre doubles accolades viennent de src/content/meta.ts (plugin de vite.config.ts).
    -->
    <title>{{page404.titreOnglet}}</title>
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/404.css" />
    <script>
      // Même règle que la page d'accueil : ?theme=light|dark, sinon prefers-color-scheme.
      (function () {
        var p = new URLSearchParams(location.search).get('theme');
        var t = p === 'light' || p === 'dark'
          ? p
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'dark' ? '#0b0b0c' : '#f3f3f1');
      })();
    </script>
  </head>
  <body>
    <div class="piste da-trame p-introuvable">
      <header class="p-barre">
        <a class="p-logo" translate="no" href="%BASE_URL%">{{page404.logo}}</a>
      </header>
      <main class="p-introuvable-contenu">
        <span class="p-filet" aria-hidden="true"></span>
        <!-- Le code, en trame de points. Décoratif : le titre dit la même chose. -->
        <p class="p-introuvable-code" aria-hidden="true">{{page404.code}}</p>
        <h1 class="p-titre">{{page404.titre}}</h1>
        <p class="p-introuvable-texte">{{page404.texte}}</p>
        <div class="p-actions">
          <a class="p-bouton p-bouton-plein" href="%BASE_URL%">
            <!-- Picto « précédent » du site (lucide, arrow-left), trait de 2 px, 18 px. -->
            <svg class="p-picto" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
            {{page404.retour}}
          </a>
        </div>
        <nav class="p-introuvable-raccourcis" aria-label="{{page404.raccourcis}}">
          <p class="p-label">{{page404.raccourcis}}</p>
          <ul>
            <li><a class="p-lien" href="%BASE_URL%#projets">{{page404.projets}}</a></li>
            <li><a class="p-lien" href="%BASE_URL%#epreuves">{{page404.epreuves}}</a></li>
            <li><a class="p-lien" href="%BASE_URL%#contact">{{page404.contact}}</a></li>
          </ul>
        </nav>
      </main>
    </div>
  </body>
</html>
