# Publication du portfolio sur GitHub Pages : https://wladimirbigand.fr/Portefolio/
#
# À chaque poussée sur main (ou à la demande, onglet Actions) : installation, build Vite, puis
# publication du dossier dist/. Rien d'autre que dist/ n'est servi.
# Prérequis, à faire une seule fois AVANT la première poussée :
# Settings > Pages > Build and deployment > Source : « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le jeton du workflow ne peut que lire le dépôt et publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours va toujours à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Node 24 : version LTS, compatible avec Vite 8 (Node 20.19+ ou 22.12+) et vite-imagetools (22+).
      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # « tsc --noEmit && vite build » : une erreur de type arrête la publication.
      - name: Construire le site
        run: npm run build

      # La page 404 doit être à la racine du dossier publié : GitHub Pages la sert sous /Portefolio/.
      - name: Vérifier le dossier publié
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/apercu.png
          test -f dist/docs/e5-tableau-de-synthese.pdf
          test -f dist/docs/e6-neoretail.pdf
          if grep -rIl '{{' dist --include='*.html'; then echo 'Un texte entre accolades est resté dans une page.'; exit 1; fi

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le dossier dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v5
