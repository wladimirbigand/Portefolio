<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Accordée au thème par le script ci-dessous, puis par src/lib/theme.ts à chaque bascule. -->
    <meta name="theme-color" content="#f3f3f1" />
    <!--
      Les textes entre doubles accolades viennent de src/content/meta.ts : ils sont écrits ici par
      le plugin « pages statiques » de vite.config.ts.
    -->
    <title>{{meta.titre}}</title>
    <meta name="description" content="{{meta.description}}" />
    <meta name="author" content="{{meta.nom}}" />
    <link rel="canonical" href="{{urlSite}}" />

    <!-- Aperçu de partage : Open Graph (LinkedIn, Discord, messageries) et Twitter Card. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{meta.region}}" />
    <meta property="og:site_name" content="{{meta.nom}}" />
    <meta property="og:title" content="{{meta.titre}}" />
    <meta property="og:description" content="{{meta.description}}" />
    <meta property="og:url" content="{{urlSite}}" />
    <meta property="og:image" content="{{urlApercu}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="{{meta.apercu.largeur}}" />
    <meta property="og:image:height" content="{{meta.apercu.hauteur}}" />
    <meta property="og:image:alt" content="{{meta.apercu.alt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{meta.titre}}" />
    <meta name="twitter:description" content="{{meta.description}}" />
    <meta name="twitter:image" content="{{urlApercu}}" />
    <meta name="twitter:image:alt" content="{{meta.apercu.alt}}" />

    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicon/apple-touch-icon.png" />

    <!-- Données structurées (schema.org : le site et la personne). -->
    <script type="application/ld+json">{{{donneesStructurees}}}</script>
    <script>
      // Applique le thème avant le premier rendu (évite le flash).
      // ?theme=light|dark force le thème ; sinon on suit prefers-color-scheme.
      (function () {
        var p = new URLSearchParams(location.search).get('theme');
        var t = p === 'light' || p === 'dark'
          ? p
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', t === 'dark' ? '#0b0b0c' : '#f3f3f1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Sans JavaScript, la page ne se construit pas : l'essentiel est écrit ici. -->
    <noscript>
      <div class="piste da-trame p-sans-script">
        <main>
          <h1 class="p-nom" translate="no">{{meta.nom}}</h1>
          <p class="p-sans-script-titre">{{sansScript.titre}}</p>
          <p>{{sansScript.texte}}</p>
          <h2 class="p-label">{{sansScript.contact}}</h2>
          <ul>
            <li><a class="p-lien" href="mailto:{{sansScript.email}}">{{sansScript.email}}</a></li>
            <li><a class="p-lien" href="{{liens.linkedin}}">{{sansScript.linkedin}}</a></li>
            <li><a class="p-lien" href="{{liens.github}}">{{sansScript.github}}</a></li>
          </ul>
          <h2 class="p-label">{{sansScript.documents}}</h2>
          <ul>
            {{{documentsSansScript}}}
          </ul>
        </main>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
